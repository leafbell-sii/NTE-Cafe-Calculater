<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NTE 별미 카페 시간당 수익 계산기 · 최적 메뉴/직원 조합 찾기" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // 첫 렌더 전에 테마 적용 (규칙은 src/theme.ts와 동일)
      (function () {
        var p = null;
        try { p = localStorage.getItem('nte-cafe:theme'); } catch (e) {}
        var light = p === 'light' || (p !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
      // 첫 렌더 전에 화면 모드 적용 (규칙은 src/view.ts와 동일)
      (function () {
        var v = null;
        try { v = localStorage.getItem('nte-cafe:view'); } catch (e) {}
        if (v !== 'mobile' && v !== 'desktop') v = 'auto';
        var root = document.documentElement;
        root.dataset.viewPref = v;
        if (v === 'desktop') document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1200');
        root.dataset.view = v === 'auto' ? (matchMedia('(min-width: 900px)').matches ? 'desktop' : 'mobile') : v;
      })();
    </script>
    <title>NTE 별미 카페 계산기</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
